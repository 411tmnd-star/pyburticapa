name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Takeout -> knowledge base (end to end)
        run: python -m unittest discover -s tests -v
      - name: Prompt/reply pipeline
        run: |
          python -m pip install beautifulsoup4 markdownify
          python -B -X utf8 python_skills/confirmed/prompt_reply_pipeline/tests/test_pipeline.py
          python -B -X utf8 python_skills/confirmed/prompt_reply_pipeline/tests/test_speaker_cases.py
      - name: X link intake
        run: |
          python -m pip install requests
          python -B -X utf8 python_skills/confirmed/x_pipeline/tests/test_x_link.py
      - name: yt-outliers
        run: |
          python -B -X utf8 -m unittest discover -s python_skills/confirmed/yt_outliers/tests -v
          python -B -X utf8 python_skills/confirmed/yt_outliers/yt_outliers.py --dry-run --out yt_dry_run
      - name: Schema validator
        run: python -B -X utf8 python_skills/confirmed/schema_validate/tests/test_schema_validate.py
      - name: Demo runs
        run: python demo.py
